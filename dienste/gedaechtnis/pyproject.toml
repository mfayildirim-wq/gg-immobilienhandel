[project]
name = "gedaechtnis-dienst"
version = "0.1.0"
description = "Zentrales Gedächtnis für Apps und KI: Mem0 mit Mandanten, Freigaben, Ersetzen und Protokoll; REST und MCP."
requires-python = ">=3.12,<3.13"
dependencies = [
  "mem0ai==2.2.1",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "ollama>=0.4",
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "mcp>=1.9,<2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
