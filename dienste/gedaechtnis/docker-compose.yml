# Server (Coolify-Host): Dienst hinter dem Coolify-Traefik, eigene Postgres mit pgvector.
# .env neben dieser Datei: POSTGRES_PASSWORD, ANTHROPIC_API_KEY, GEDAECHTNIS_ZUGAENGE (Hashes), GEDAECHTNIS_HOST
services:
  dienst:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GEDAECHTNIS_DB: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/gedaechtnis
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEDAECHTNIS_ZUGAENGE: ${GEDAECHTNIS_ZUGAENGE}
    volumes: [daten:/daten]
    networks: [intern, coolify]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.gedaechtnis-http.entrypoints: http
      traefik.http.routers.gedaechtnis-http.rule: Host(`${GEDAECHTNIS_HOST}`)
      traefik.http.routers.gedaechtnis-http.middlewares: gedaechtnis-https
      traefik.http.middlewares.gedaechtnis-https.redirectscheme.scheme: https
      traefik.http.routers.gedaechtnis.entrypoints: https
      traefik.http.routers.gedaechtnis.rule: Host(`${GEDAECHTNIS_HOST}`)
      traefik.http.routers.gedaechtnis.tls: "true"
      traefik.http.routers.gedaechtnis.tls.certresolver: letsencrypt
      traefik.http.services.gedaechtnis.loadbalancer.server.port: "8800"
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gedaechtnis
    volumes: [pg:/var/lib/postgresql/data]
    networks: [intern]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gedaechtnis"]
      interval: 5s
      retries: 20
volumes: { daten: {}, pg: {} }
networks:
  intern: {}
  coolify: { external: true }
